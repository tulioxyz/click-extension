<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Página de Teste - Auto Clicker em Lote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      padding: 24px;
      color: #334155;
    }
    .wrapper {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h2 { font-size: 19px; color: #1e293b; }
    p.subtitle { color: #64748b; font-size: 13.5px; }
    
    .table-container {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    thead th {
      background: #f8fafc;
      padding: 12px 14px;
      font-weight: 600;
      color: #475569;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }
    tbody tr:hover {
      background: #f8fafc;
    }
    td {
      padding: 12px 14px;
      vertical-align: middle;
    }
    .user-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11.5px;
      color: #ffffff;
      flex-shrink: 0;
    }
    .c1 { background: #3b82f6; }
    .c2 { background: #10b981; }
    .c3 { background: #8b5cf6; }
    .c4 { background: #f59e0b; }
    .c5 { background: #ec4899; }
    .c6 { background: #06b6d4; }
    .c7 { background: #6366f1; }
    .c8 { background: #14b8a6; }

    .user-info .name {
      font-weight: 600;
      color: #1e293b;
      font-size: 13px;
    }
    .user-info .email {
      font-size: 11.5px;
      color: #64748b;
    }
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      background: #0284c7;
      color: white;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .action-btn {
      background: none;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 15px;
      padding: 4px 6px;
      border-radius: 4px;
      transition: all 0.15s;
      color: #64748b;
    }
    .action-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      transform: scale(1.1);
    }
    .action-btn.trash:hover {
      background: #fee2e2;
      border-color: #fca5a5;
    }

    /* Paginação */
    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-top: 1px solid #e2e8f0;
      background: #f8fafc;
      font-size: 12.5px;
      color: #64748b;
    }
    .pagination-buttons {
      display: flex;
      gap: 6px;
    }
    .page-btn {
      padding: 5px 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      color: #334155;
    }
    .page-btn.active {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
    }

    /* Painel de Logs */
    .log-card {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #1e293b;
    }
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .log-stats {
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
    }
    .btn-clear-logs {
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-clear-logs:hover {
      background: #475569;
      color: #ffffff;
    }
    .log-list {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-item {
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.03);
    }
    .log-item.highlight {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <div class="header-area">
      <div>
        <h2>Tabela de Teste - Auto Clicker</h2>
        <p class="subtitle">16 pessoas cadastradas na página para testar os cliques em lote com precisão.</p>
      </div>
      <button onclick="window.dispatchEvent(new KeyboardEvent('keydown', { key: 'c', altKey: true }))" style="background: #4f46e5; color: white; border: none; padding: 9px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);">
        ⚡ Abrir Painel Arrastável (Alt+C)
      </button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th width="35"><input type="checkbox"></th>
            <th>Participante</th>
            <th>Cargo</th>
            <th>Status</th>
            <th>Data de Registro</th>
            <th width="190">Ações</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- As linhas são geradas dinamicamente com 16 pessoas reais -->
        </tbody>
      </table>

      <div class="pagination-bar">
        <span>Mostrando <strong>1 a 16</strong> de <strong>48</strong> resultados</span>
        <div class="pagination-buttons">
          <button class="page-btn active">1</button>
          <button class="page-btn">2</button>
          <button class="page-btn">3</button>
          <button class="page-btn">Próxima &raquo;</button>
        </div>
      </div>
    </div>
  </div>

  <div class="log-card">
    <div class="log-header">
      <div class="log-stats" id="log-counter">📊 Total de cliques registrados: 0</div>
      <button class="btn-clear-logs" onclick="clearLogs()">Limpar Registro</button>
    </div>
    <div class="log-list" id="click-logs">
      <div class="log-item" style="color: #94a3b8;">Aguardando cliques da extensão...</div>
    </div>
  </div>
</div>

<script>
  const users = [
    { name: "Carlos Roberto de Oliveira", email: "carlos.oliveira@ifam.edu.br", role: "Gestores", color: "c1", init: "CR" },
    { name: "Carlos Simões", email: "carlos.machado@mma.gov.br", role: "Palestrantes", color: "c2", init: "CS" },
    { name: "Carolina Mary Medeiros", email: "carolinamedeiros@cp2.g12.br", role: "Gestores", color: "c3", init: "CM" },
    { name: "Cássio Viana Santos", email: "kmviana@ifba.edu.br", role: "Gestores", color: "c4", init: "CV" },
    { name: "Charles Okama de Souza", email: "charlessouza@mec.gov.br", role: "Gestores", color: "c5", init: "CO" },
    { name: "Chirlaine Cristine Goncalves", email: "chirlaine.cristine@ifs.edu.br", role: "Gestores", color: "c6", init: "CC" },
    { name: "Christiane Pereira dos Santos", email: "christiane.santos@inss.gov.br", role: "Avaliadores", color: "c7", init: "CP" },
    { name: "Daniela Ramos Albuquerque", email: "daniela.ramos@ufmg.br", role: "Palestrantes", color: "c8", init: "DR" },
    { name: "Eduardo Farias Brandão", email: "eduardo.farias@fiocruz.br", role: "Gestores", color: "c1", init: "EF" },
    { name: "Fabiana Toledo Barreto", email: "fabiana.barreto@unb.br", role: "Palestrantes", color: "c2", init: "FT" },
    { name: "Gabriel Monteiro Lima", email: "gabriel.lima@embrapa.br", role: "Gestores", color: "c3", init: "GM" },
    { name: "Helena Castro Guimarães", email: "helena.castro@mctic.gov.br", role: "Avaliadores", color: "c4", init: "HC" },
    { name: "Igor Vasconcelos Brito", email: "igor.brito@ufrj.br", role: "Gestores", color: "c5", init: "IV" },
    { name: "Juliana Mendes Peixoto", email: "juliana.peixoto@ibama.gov.br", role: "Palestrantes", color: "c6", init: "JM" },
    { name: "Lucas Antunes Silveira", email: "lucas.silveira@receita.fazenda.gov.br", role: "Gestores", color: "c7", init: "LA" },
    { name: "Mariana Costa Bezerra", email: "mariana.costa@anvisa.gov.br", role: "Avaliadores", color: "c8", init: "MC" }
  ];

  const tbody = document.getElementById('table-body');
  users.forEach((u, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="checkbox"></td>
      <td>
        <div class="user-cell">
          <div class="avatar ${u.color}">${u.init}</div>
          <div class="user-info">
            <div class="name">${u.name}</div>
            <div class="email">${u.email}</div>
          </div>
        </div>
      </td>
      <td>${u.role}</td>
      <td><span class="badge-status">✉ Enviado</span></td>
      <td>28/09/2026, 21:58:${(10 + i).toString().padStart(2, '0')}</td>
      <td>
        <div class="actions">
          <button class="action-btn" title="Editar (Lápis)" onclick="recordClick('${u.name}', 'Lápis (Editar)')">✏️</button>
          <button class="action-btn" title="Enviar Mensagem 1" onclick="recordClick('${u.name}', 'Envelope 1')">✉️</button>
          <button class="action-btn" title="Enviar Mensagem 2" onclick="recordClick('${u.name}', 'Envelope 2')">📨</button>
          <button class="action-btn" title="Cancelar Inscrição" onclick="recordClick('${u.name}', 'Cancelar (X)')">✖️</button>
          <button class="action-btn trash" title="Excluir Participante" onclick="recordClick('${u.name}', 'Lixeira (Excluir)')">🗑️</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  let totalClicks = 0;
  function recordClick(person, action) {
    totalClicks++;
    document.getElementById('log-counter').textContent = `📊 Total de cliques registrados: ${totalClicks}`;
    
    const logs = document.getElementById('click-logs');
    if (totalClicks === 1 && logs.children.length === 1 && logs.children[0].textContent.includes('Aguardando')) {
      logs.innerHTML = '';
    }

    const time = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = 'log-item highlight';
    entry.textContent = `[${time}] (#${totalClicks}) ${action} acionado para "${person}"`;
    logs.prepend(entry);
  }

  function clearLogs() {
    totalClicks = 0;
    document.getElementById('log-counter').textContent = `📊 Total de cliques registrados: 0`;
    document.getElementById('click-logs').innerHTML = '<div class="log-item" style="color: #94a3b8;">Registro limpo. Aguardando novos cliques...</div>';
  }
</script>

</body>
</html>
